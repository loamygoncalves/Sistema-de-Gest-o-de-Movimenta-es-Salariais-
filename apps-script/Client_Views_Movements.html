<script>
  /* =====================================================================
     Módulo 3 — Movimentações  +  Módulo 4 — Simulador de impacto
     api_listMovements / api_getMovement / api_createMovement /
     api_updateMovement / api_cancelMovement / api_simulateMovement /
     api_submitMovement / api_getApprovalTimeline
     ===================================================================== */

  function movementTypeOptions() {
    return Object.keys(LABELS.movementType).map(function (k) {
      return { id: k, name: LABELS.movementType[k] };
    });
  }

  /** Mostra o salário atual do colaborador — usado por Promoção e Mérito, ao lado dos campos de novo salário/percentual (ver wireSalaryPercentSync_). */
  function reajusteHintText_(emp) {
    if (!emp) return '';
    return 'Salário atual: ' + fmt.currency(Number(emp.currentSalary));
  }

  /**
   * Liga um input de "novo salário" e um de "percentual de reajuste" para se
   * atualizarem um ao outro a partir do salário atual do colaborador —
   * preencher qualquer um dos dois calcula o outro automaticamente.
   * `getCurrentSalary` é uma função (não um valor fixo) porque o colaborador
   * selecionado pode mudar depois que os campos já existem no DOM. Retorna
   * `{ refresh }` para o chamador recalcular o percentual quando o salário
   * atual mudar por fora (troca de colaborador), sem perder o que o usuário
   * já digitou no campo que ele estava editando.
   */
  function wireSalaryPercentSync_(salaryInputId, percentInputId, getCurrentSalary) {
    var salEl = document.getElementById(salaryInputId);
    var pctEl = document.getElementById(percentInputId);
    if (!salEl || !pctEl) return { refresh: function () {} };
    var lastEdited = null;

    function recomputePercentFromSalary() {
      var current = getCurrentSalary();
      var salary = Number(salEl.value);
      if (!current || current <= 0 || salEl.value === '' || isNaN(salary)) {
        pctEl.value = '';
        return;
      }
      pctEl.value = (((salary - current) / current) * 100).toFixed(2);
    }

    salEl.addEventListener('input', function () {
      lastEdited = 'salary';
      recomputePercentFromSalary();
    });

    pctEl.addEventListener('input', function () {
      lastEdited = 'percent';
      var current = getCurrentSalary();
      if (!current || current <= 0 || pctEl.value === '') {
        if (pctEl.value === '') salEl.value = '';
        return;
      }
      var percent = Number(pctEl.value);
      if (isNaN(percent)) return;
      salEl.value = (current * (1 + percent / 100)).toFixed(2);
    });

    return {
      refresh: function () {
        if (lastEdited === 'percent') return;
        recomputePercentFromSalary();
      },
    };
  }

  function metricTile(label, value, highlight) {
    return (
      '<div class="kpi-tile' +
      (highlight ? ' highlight' : '') +
      '"><div class="kpi-label">' +
      escapeHtml(label) +
      '</div><div class="kpi-value">' +
      value +
      '</div></div>'
    );
  }

  function simulationPanelHtml(sim) {
    if (!sim) {
      return '<p class="text-sm text-muted">Nenhuma simulação executada ainda. Clique em "Executar simulação".</p>';
    }
    var bannerClass = sim.exceedsBudget ? 'banner-danger' : 'banner-success';
    var policyViolations = sim.policyViolations || [];
    var policyBannerHtml =
      policyViolations.length > 0
        ? '<div class="banner banner-warn" style="margin-bottom:16px;">' +
          '<p style="font-weight:600;margin-bottom:4px;">Fora da Política de Remuneração</p>' +
          '<ul style="margin:0;padding-left:18px;">' +
          policyViolations.map(function (v) { return '<li>' + escapeHtml(v) + '</li>'; }).join('') +
          '</ul></div>'
        : '';
    return (
      '<div class="banner ' +
      bannerClass +
      '" style="margin-bottom:16px;">' +
      escapeHtml(sim.alertMessage || '') +
      '</div>' +
      policyBannerHtml +
      '<div class="grid grid-3">' +
      metricTile('Meses Restantes no Ano', fmt.number(sim.monthsRemaining)) +
      metricTile('Impacto Salarial Mensal', fmt.currency(sim.monthlySalaryImpact)) +
      metricTile('Impacto Salarial Anual', fmt.currency(sim.annualSalaryImpact)) +
      metricTile('Total de Encargos (mensal)', fmt.currency(sim.chargesTotal)) +
      metricTile('Total de Benefícios (mensal)', fmt.currency(sim.benefitsTotal)) +
      metricTile('% Aumento Salarial', sim.salaryIncreasePercent != null ? fmt.percent(sim.salaryIncreasePercent) : '—') +
      '</div>' +
      '<div class="grid grid-2" style="margin-top:12px;">' +
      metricTile('Impacto Total Mensal', fmt.currency(sim.totalMonthlyImpact), true) +
      metricTile('Impacto Total Anual', fmt.currency(sim.totalAnnualImpact), true) +
      '</div>' +
      '<div style="margin-top:18px;"><p class="uppercase-label" style="margin-bottom:4px;">Comparativo Orçamentário do Centro de Resultado</p>' +
      '<p class="text-sm text-muted" style="margin-bottom:8px;">Projeção do ano inteiro (jan-dez): acumulado real dos meses já fechados + o restante do ano projetado a partir do último fechamento já com esta movimentação, comparado ao orçamento anual.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Orçado (ano)</th><th>Atual (acumulado)</th><th>Projeção (ano)</th><th>Diferença</th><th>% Consumido</th></tr></thead><tbody>' +
      '<tr><td>' +
      fmt.currency(sim.budgetedDirectoratePayroll) +
      '</td><td>' +
      fmt.currency(sim.currentDirectoratePayroll) +
      '</td><td>' +
      fmt.currency(sim.payrollAfterApproval) +
      '</td><td style="font-weight:600;color:' +
      (sim.difference < 0 ? 'var(--red-600)' : 'var(--green-600)') +
      ';">' +
      fmt.currency(sim.difference) +
      '</td><td style="font-weight:600;' +
      (sim.percentConsumed > 100 ? 'color:var(--red-600);' : '') +
      '">' +
      fmt.percent(sim.percentConsumed) +
      '</td></tr></tbody></table></div></div>'
    );
  }

  function approvalTimelineHtml(steps) {
    if (!steps || steps.length === 0) {
      return '<p class="text-sm text-muted">Nenhuma etapa de aprovação registrada ainda.</p>';
    }
    var ordered = steps.slice().sort(function (a, b) {
      return Number(a.stepOrder) - Number(b.stepOrder);
    });
    return (
      '<ol class="timeline">' +
      ordered
        .map(function (step, idx) {
          var dotClass = step.status === 'APROVADO' ? 'done' : step.status === 'REPROVADO' ? 'rejected' : '';
          return (
            '<li class="timeline-item"><div class="timeline-marker-col"><div class="timeline-dot ' +
            dotClass +
            '">' +
            (idx + 1) +
            '</div>' +
            (idx < ordered.length - 1 ? '<div class="timeline-line"></div>' : '') +
            '</div><div class="timeline-body"><div class="row" style="gap:8px;"><strong>' +
            escapeHtml(
              step.decidedByRole
                ? labelFor('approverRole', step.decidedByRole)
                : (step.eligibleRoles || []).map(function (r) { return labelFor('approverRole', r); }).join(' ou ')
            ) +
            '</strong>' +
            badge('approvalStatus', step.status) +
            '</div>' +
            (step.approverEmail ? '<p class="text-xs text-muted">Aprovador: ' + escapeHtml(step.approverEmail) + '</p>' : '') +
            (step.comment ? '<p class="text-sm" style="margin-top:4px;color:var(--slate-700);">“' + escapeHtml(step.comment) + '”</p>' : '') +
            (step.decidedAt ? '<p class="text-xs text-faint">' + fmt.dateTime(step.decidedAt) + '</p>' : '') +
            '</div></li>'
          );
        })
        .join('') +
      '</ol>'
    );
  }

  // -----------------------------------------------------------------------
  // Lista de movimentações
  // -----------------------------------------------------------------------
  Views.movements = function (root) {
    var user = App.user;
    var state = {
      status: '',
      type: '',
      directorateId: isScopedRole(user) ? user.directorateId || '' : '',
    };

    root.innerHTML =
      '<div class="page-header"><div><h1>Movimentações</h1><p>Solicitações de promoção, mérito e aumento de quadro.</p></div>' +
      '<button class="btn" data-route="#/movements/new">+ Nova Movimentação</button></div>' +
      '<div class="filter-bar" id="mov-filters"></div>' +
      '<div id="mov-table-wrap">' +
      loadingHtml() +
      '</div>';

    getOrgLookups()
      .then(function (org) {
        renderFilters(org);
        loadList();
      })
      .catch(function (err) {
        document.getElementById('mov-table-wrap').innerHTML = errorStateHtml(apiErrorMessage(err));
      });

    function renderFilters(org) {
      var el = document.getElementById('mov-filters');
      var directorateFilterHtml = '';
      if (!isScopedRole(user)) {
        directorateFilterHtml =
          '<div class="col"><label>Diretoria</label><select id="mov-f-directorate"><option value="">Todas</option>' +
          optionsHtml(org.directorates, { selected: state.directorateId }) +
          '</select></div>';
      }
      el.innerHTML =
        '<div class="col"><label>Status</label><select id="mov-f-status"><option value="">Todos</option>' +
        optionsHtml(
          Object.keys(LABELS.movementStatus).map(function (k) {
            return { id: k, name: LABELS.movementStatus[k] };
          }),
          { selected: state.status }
        ) +
        '</select></div>' +
        '<div class="col"><label>Tipo</label><select id="mov-f-type"><option value="">Todos</option>' +
        optionsHtml(movementTypeOptions(), { selected: state.type }) +
        '</select></div>' +
        directorateFilterHtml;

      document.getElementById('mov-f-status').addEventListener('change', function (e) { state.status = e.target.value; loadList(); });
      document.getElementById('mov-f-type').addEventListener('change', function (e) { state.type = e.target.value; loadList(); });
      var dirEl = document.getElementById('mov-f-directorate');
      if (dirEl) dirEl.addEventListener('change', function (e) { state.directorateId = e.target.value; loadList(); });
    }

    function loadList() {
      var wrap = document.getElementById('mov-table-wrap');
      wrap.innerHTML = loadingHtml();
      callApi('api_listMovements', {
        status: state.status || undefined,
        type: state.type || undefined,
        directorateId: state.directorateId || undefined,
      })
        .then(function (list) {
          if (!list || list.length === 0) {
            wrap.innerHTML = emptyStateHtml('Nenhuma movimentação encontrada com os filtros atuais.');
            return;
          }
          wrap.innerHTML =
            '<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Colaborador / Diretoria</th><th>Salário Atual → Novo</th>' +
            '<th>Data Efetiva</th><th>Status</th><th>Criado em</th></tr></thead><tbody>' +
            list
              .map(function (m) {
                var subject = m.employeeName || m.directorateName || '—';
                var salaryChange =
                  m.newSalary != null && m.currentSalary != null
                    ? fmt.currency(m.currentSalary) + ' → ' + fmt.currency(m.newSalary)
                    : m.plannedSalary != null
                    ? '— → ' + fmt.currency(m.plannedSalary) + ' (x' + fmt.number(m.quantity) + ')'
                    : '—';
                return (
                  '<tr class="clickable" data-route="#/movements/' +
                  m.id +
                  '"><td>' +
                  escapeHtml(labelFor('movementType', m.type)) +
                  '</td><td>' +
                  escapeHtml(subject) +
                  '</td><td>' +
                  salaryChange +
                  '</td><td>' +
                  fmt.date(m.effectiveDate) +
                  '</td><td>' +
                  badge('movementStatus', m.status) +
                  '</td><td>' +
                  fmt.dateTime(m.createdAt) +
                  '</td></tr>'
                );
              })
              .join('') +
            '</tbody></table></div>';
        })
        .catch(function (err) {
          wrap.innerHTML = errorStateHtml(apiErrorMessage(err));
        });
    }
  };

  // -----------------------------------------------------------------------
  // Nova movimentação
  // -----------------------------------------------------------------------
  Views.movementNew = function (root) {
    var org, employees;
    // Pré-preenchimento vindo do Simulador Rápido (ver Views.simulator) — a
    // pessoa já simulou o impacto e quer abrir a solicitação real com os
    // mesmos dados. Consumido uma única vez (não sobrevive a um refresh).
    var prefill = App.movementPrefill || null;
    App.movementPrefill = null;
    var type = (prefill && prefill.type) || 'PROMOCAO';
    var employeePicker = null;
    var prefillEmployee = null;

    root.innerHTML = loadingHtml();

    Promise.all([getOrgLookups(), callApi('api_listEmployees', { status: 'ATIVO' })])
      .then(function (results) {
        org = results[0];
        employees = results[1] || [];
        if (prefill && prefill.employeeId) {
          prefillEmployee = employees.filter(function (e) { return e.id === prefill.employeeId; })[0] || null;
        }
        render();
      })
      .catch(function (err) {
        root.innerHTML = errorStateHtml(apiErrorMessage(err));
      });

    function typeFieldsHtml(t) {
      if (t === 'PROMOCAO') {
        return (
          '<div class="field"><label>Colaborador <span class="req">*</span></label><div id="mn-employee-picker"></div>' +
          '<p class="field-error" id="mn-err-employee" style="display:none;"></p></div>' +
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Cargo <span class="req">*</span></label><select id="mn-newPositionId">' +
          optionsHtml(org.positions, { placeholder: 'Selecione' }) +
          '</select><p class="field-error" id="mn-err-newPositionId" style="display:none;"></p></div>' +
          '<div class="field"><label>Novo Salário <span class="req">*</span></label><input type="number" step="0.01" id="mn-newSalary">' +
          '<p class="field-hint" id="mn-hint-newSalary"></p><p class="field-error" id="mn-err-newSalary" style="display:none;"></p></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="mn-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>'
        );
      }
      if (t === 'MERITO') {
        return (
          '<div class="field"><label>Colaborador <span class="req">*</span></label><div id="mn-employee-picker"></div>' +
          '<p class="field-error" id="mn-err-employee" style="display:none;"></p></div>' +
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Salário <span class="req">*</span></label><input type="number" step="0.01" id="mn-newSalary">' +
          '<p class="field-hint" id="mn-hint-newSalary"></p><p class="field-error" id="mn-err-newSalary" style="display:none;"></p></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="mn-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>'
        );
      }
      if (t === 'AUMENTO_QUADRO') {
        return (
          '<div class="form-grid">' +
          '<div class="field"><label>Cargo <span class="req">*</span></label><select id="mn-positionId">' +
          optionsHtml(org.positions, { placeholder: 'Selecione' }) +
          '</select><p class="field-error" id="mn-err-positionId" style="display:none;"></p></div>' +
          '<div class="field"><label>Diretoria <span class="req">*</span></label><select id="mn-directorateId">' +
          optionsHtml(org.directorates, { placeholder: 'Selecione' }) +
          '</select><p class="field-error" id="mn-err-directorateId" style="display:none;"></p></div>' +
          '<div class="field"><label>Centro de Resultado <span class="req">*</span></label><select id="mn-costCenterId">' +
          optionsHtml(org.costCenters, { placeholder: 'Selecione' }) +
          '</select><p class="field-error" id="mn-err-costCenterId" style="display:none;"></p></div>' +
          '<div class="field"><label>Quantidade de Vagas <span class="req">*</span></label><input type="number" min="1" step="1" id="mn-quantity" value="1">' +
          '<p class="field-error" id="mn-err-quantity" style="display:none;"></p></div>' +
          '<div class="field"><label>Salário Planejado <span class="req">*</span></label><input type="number" step="0.01" id="mn-plannedSalary">' +
          '<p class="field-error" id="mn-err-plannedSalary" style="display:none;"></p></div>' +
          '</div>'
        );
      }
      return '';
    }

    function render() {
      root.innerHTML =
        '<div class="page-header"><div><a href="#" data-route="#/movements" class="text-xs text-faint">← Voltar para Movimentações</a>' +
        '<h1 style="margin-top:4px;">Nova Movimentação</h1><p>Preencha os dados de acordo com o tipo de movimentação.</p></div></div>' +
        cardOpen() +
        '<div class="field"><label>Tipo de Movimentação <span class="req">*</span></label><select id="mn-type">' +
        optionsHtml(movementTypeOptions(), { selected: type }) +
        '</select></div>' +
        '<div id="mn-type-fields"></div>' +
        '<div class="field" style="margin-top:14px;"><label>Data Efetiva <span class="req">*</span></label>' +
        '<input type="date" id="mn-effectiveDate" style="max-width:220px;">' +
        '<p class="field-error" id="mn-err-effectiveDate" style="display:none;"></p></div>' +
        '<div class="field"><label>Justificativa <span class="req">*</span></label><textarea id="mn-justification" rows="3"></textarea>' +
        '<p class="field-error" id="mn-err-justification" style="display:none;"></p></div>' +
        '<div class="form-actions"><button class="btn btn-outline" data-route="#/movements">Cancelar</button>' +
        '<button class="btn" id="mn-submit-btn">Criar Movimentação</button></div>' +
        cardClose();

      document.getElementById('mn-type').addEventListener('change', function (e) {
        type = e.target.value;
        renderTypeFields();
      });
      document.getElementById('mn-submit-btn').addEventListener('click', handleSubmit);
      renderTypeFields();
      if (prefill && prefill.effectiveDate) {
        var dateEl = document.getElementById('mn-effectiveDate');
        if (dateEl) dateEl.value = prefill.effectiveDate;
      }
    }

    var salaryPercentSync = null;

    function updateSalaryHint() {
      var hint = document.getElementById('mn-hint-newSalary');
      var emp = employeePicker && employeePicker.getSelected();
      if (hint) hint.textContent = reajusteHintText_(emp);
      if (salaryPercentSync) salaryPercentSync.refresh();
    }

    function renderTypeFields() {
      var el = document.getElementById('mn-type-fields');
      el.innerHTML = typeFieldsHtml(type);
      var pickerEl = document.getElementById('mn-employee-picker');
      employeePicker = null;
      if (pickerEl) {
        employeePicker = mountEmployeePicker(pickerEl, employees, {
          initialEmployee: prefillEmployee,
          onChange: updateSalaryHint,
        });
      }
      var salEl = document.getElementById('mn-newSalary');
      if (salEl) salEl.addEventListener('input', updateSalaryHint);
      salaryPercentSync = wireSalaryPercentSync_('mn-newSalary', 'mn-newPercent', function () {
        var emp = employeePicker && employeePicker.getSelected();
        return emp ? Number(emp.currentSalary) : null;
      });

      if (prefill && prefill.newSalary != null && salEl) {
        salEl.value = prefill.newSalary;
      }
      if (prefill && type === 'PROMOCAO' && prefill.newPositionId) {
        var posEl = document.getElementById('mn-newPositionId');
        if (posEl) posEl.value = prefill.newPositionId;
      }
      updateSalaryHint();
    }

    function clearErrors() {
      root.querySelectorAll('.field-error').forEach(function (e) {
        e.style.display = 'none';
        e.textContent = '';
      });
    }
    function setError(id, message) {
      var el = document.getElementById('mn-err-' + id);
      if (el) {
        el.textContent = message;
        el.style.display = 'block';
      }
    }
    function v(id) {
      var el = document.getElementById('mn-' + id);
      return el ? el.value : '';
    }

    function validateAndBuildPayload() {
      clearErrors();
      var errors = {};
      var effectiveDate = v('effectiveDate');
      var justification = v('justification').trim();
      if (!effectiveDate) errors.effectiveDate = 'Informe a data efetiva.';
      if (!justification) errors.justification = 'Informe a justificativa.';

      var payload = { type: type, effectiveDate: effectiveDate, justification: justification };

      if (type === 'PROMOCAO') {
        var emp = employeePicker && employeePicker.getSelected();
        var newPositionId = v('newPositionId');
        var newSalary = v('newSalary');
        if (!emp) errors.employee = 'Selecione o colaborador.';
        if (!newPositionId) errors.newPositionId = 'Selecione o novo cargo.';
        if (!newSalary) errors.newSalary = 'Informe o novo salário.';
        if (emp && newSalary && Number(newSalary) < Number(emp.currentSalary)) {
          errors.newSalary = 'O novo salário não pode ser menor que o salário atual (' + fmt.currency(emp.currentSalary) + ').';
        }
        if (emp) {
          payload.employeeId = emp.id;
          payload.newPositionId = newPositionId;
          payload.newSalary = Number(newSalary);
        }
      } else if (type === 'MERITO') {
        var emp2 = employeePicker && employeePicker.getSelected();
        var meritoNewSalary = v('newSalary');
        if (!emp2) errors.employee = 'Selecione o colaborador.';
        if (!meritoNewSalary) errors.newSalary = 'Informe o novo salário.';
        if (emp2 && meritoNewSalary && Number(meritoNewSalary) <= Number(emp2.currentSalary)) {
          errors.newSalary = 'O novo salário precisa ser maior que o salário atual (' + fmt.currency(emp2.currentSalary) + ').';
        }
        if (emp2) {
          payload.employeeId = emp2.id;
          payload.newSalary = Number(meritoNewSalary);
        }
      } else if (type === 'AUMENTO_QUADRO') {
        var positionId = v('positionId');
        var directorateId = v('directorateId');
        var costCenterId = v('costCenterId');
        var quantity = v('quantity');
        var plannedSalary = v('plannedSalary');
        if (!positionId) errors.positionId = 'Selecione o cargo.';
        if (!directorateId) errors.directorateId = 'Selecione a diretoria.';
        if (!costCenterId) errors.costCenterId = 'Selecione o centro de resultado.';
        if (!quantity || Number(quantity) < 1) errors.quantity = 'Informe uma quantidade válida.';
        if (plannedSalary === '' || Number(plannedSalary) < 0) errors.plannedSalary = 'Informe um salário planejado válido.';
        payload.positionId = positionId;
        payload.directorateId = directorateId;
        payload.costCenterId = costCenterId;
        payload.quantity = Number(quantity);
        payload.plannedSalary = Number(plannedSalary);
      }

      var hasErrors = Object.keys(errors).length > 0;
      if (hasErrors) {
        Object.keys(errors).forEach(function (key) {
          setError(key, errors[key]);
        });
        return null;
      }
      return payload;
    }

    function handleSubmit() {
      var payload = validateAndBuildPayload();
      if (!payload) return;
      var btn = document.getElementById('mn-submit-btn');
      btn.disabled = true;
      btn.classList.add('is-loading');
      callApi('api_createMovement', payload)
        .then(function (created) {
          toast('Movimentação criada com sucesso.', 'success');
          goTo('#/movements/' + created.id);
        })
        .catch(function (err) {
          toastError(err);
        })
        .finally(function () {
          btn.disabled = false;
          btn.classList.remove('is-loading');
        });
    }
  };

  // -----------------------------------------------------------------------
  // Detalhe de movimentação
  // -----------------------------------------------------------------------
  Views.movementDetail = function (root, id) {
    var user = App.user;
    var org = null;
    var state = { editing: false };
    root.innerHTML = loadingHtml();

    Promise.all([callApi('api_getMovement', id), getOrgLookups()])
      .then(function (results) {
        org = results[1];
        render(results[0]);
      })
      .catch(function (err) {
        root.innerHTML = errorStateHtml(apiErrorMessage(err));
      });

    function fieldHtml(label, value) {
      if (value === null || value === undefined || value === '') return '';
      return '<div><dt class="uppercase-label">' + escapeHtml(label) + '</dt><dd style="margin:2px 0 0;color:var(--slate-800);">' + escapeHtml(value) + '</dd></div>';
    }

    /** ADMIN/RH_REMUNERACAO podem corrigir uma solicitação já em aprovação, se necessário. */
    function canEditMovement(movement) {
      return movement.status === 'PENDENTE_APROVACAO' && canManage(user);
    }

    function dataCardHtml(movement) {
      return (
        cardOpen('Dados da Movimentação') +
        '<dl class="grid grid-3" style="row-gap:14px;">' +
        fieldHtml('Colaborador', movement.employeeName) +
        fieldHtml('Cargo Atual', movement.currentPositionName) +
        fieldHtml('Novo Cargo', movement.newPositionName) +
        fieldHtml('Salário Atual', movement.currentSalary != null ? fmt.currency(movement.currentSalary) : null) +
        fieldHtml('Novo Salário', movement.newSalary != null ? fmt.currency(movement.newSalary) : null) +
        fieldHtml('Percentual de Mérito', movement.meritPercentage != null ? fmt.percent(movement.meritPercentage) : null) +
        fieldHtml('Quantidade de Vagas', movement.quantity != null ? fmt.number(movement.quantity) : null) +
        fieldHtml('Salário Planejado', movement.plannedSalary != null ? fmt.currency(movement.plannedSalary) : null) +
        fieldHtml('Diretoria', movement.directorateName) +
        fieldHtml('Centro de Resultado', movement.costCenterName) +
        fieldHtml('Data Efetiva', fmt.date(movement.effectiveDate)) +
        fieldHtml('Solicitado por', movement.requestedByEmail) +
        fieldHtml('Criado em', fmt.dateTime(movement.createdAt)) +
        '</dl>' +
        '<div class="divider"></div>' +
        '<p class="uppercase-label">Justificativa</p><p class="text-sm" style="margin-top:4px;color:var(--slate-700);">' +
        escapeHtml(movement.justification) +
        '</p>' +
        cardClose()
      );
    }

    /**
     * Formulário de edição — só os campos do tipo da movimentação (nunca
     * colaborador/tipo). Salvar dispara uma nova simulação no backend
     * (MovementsService.update), então só é preciso recarregar a tela.
     */
    function editFormHtml(movement) {
      var typeFields = '';
      if (movement.type === 'PROMOCAO') {
        typeFields =
          '<div class="field"><label>Novo Cargo</label><select id="me-newPositionId">' +
          optionsHtml(org.positions, { placeholder: 'Selecione', selected: movement.newPositionId }) +
          '</select></div>' +
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Salário</label><input type="number" step="0.01" id="me-newSalary" value="' + (movement.newSalary != null ? movement.newSalary : '') + '"></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="me-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>';
      } else if (movement.type === 'MERITO') {
        typeFields =
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Salário</label><input type="number" step="0.01" id="me-newSalary" value="' + (movement.newSalary != null ? movement.newSalary : '') + '"></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="me-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>';
      } else if (movement.type === 'AUMENTO_QUADRO') {
        typeFields =
          '<div class="form-grid">' +
          '<div class="field"><label>Cargo</label><select id="me-positionId">' +
          optionsHtml(org.positions, { placeholder: 'Selecione', selected: movement.newPositionId }) +
          '</select></div>' +
          '<div class="field"><label>Diretoria</label><select id="me-directorateId">' +
          optionsHtml(org.directorates, { placeholder: 'Selecione', selected: movement.directorateId }) +
          '</select></div>' +
          '<div class="field"><label>Centro de Resultado</label><select id="me-costCenterId">' +
          optionsHtml(org.costCenters, { placeholder: 'Selecione', selected: movement.costCenterId }) +
          '</select></div>' +
          '<div class="field"><label>Quantidade de Vagas</label><input type="number" min="1" step="1" id="me-quantity" value="' + (movement.quantity != null ? movement.quantity : 1) + '"></div>' +
          '<div class="field"><label>Salário Planejado</label><input type="number" step="0.01" id="me-plannedSalary" value="' + (movement.plannedSalary != null ? movement.plannedSalary : '') + '"></div>' +
          '</div>';
      }

      return (
        cardOpen('Editar Movimentação', { subtitle: 'Alterações são salvas com uma nova simulação de impacto.' }) +
        typeFields +
        '<div class="field" style="margin-top:14px;"><label>Data Efetiva</label>' +
        '<input type="date" id="me-effectiveDate" style="max-width:220px;" value="' + escapeHtml(String(movement.effectiveDate).slice(0, 10)) + '"></div>' +
        '<div class="field"><label>Justificativa</label><textarea id="me-justification" rows="3">' + escapeHtml(movement.justification || '') + '</textarea></div>' +
        '<div class="form-actions"><button class="btn btn-outline" id="mov-edit-cancel-btn">Cancelar</button>' +
        '<button class="btn" id="mov-edit-save-btn">Salvar</button></div>' +
        cardClose()
      );
    }

    function wireEditForm(movement) {
      function v(id) {
        var el = document.getElementById('me-' + id);
        return el ? el.value : '';
      }
      if (movement.type === 'PROMOCAO' || movement.type === 'MERITO') {
        wireSalaryPercentSync_('me-newSalary', 'me-newPercent', function () {
          return movement.currentSalary != null ? Number(movement.currentSalary) : null;
        });
      }
      document.getElementById('mov-edit-cancel-btn').addEventListener('click', function () {
        state.editing = false;
        render(movement);
      });
      document.getElementById('mov-edit-save-btn').addEventListener('click', function () {
        var payload = { effectiveDate: v('effectiveDate'), justification: v('justification').trim() };
        if (movement.type === 'PROMOCAO') {
          payload.newPositionId = v('newPositionId');
          payload.newSalary = Number(v('newSalary'));
        } else if (movement.type === 'MERITO') {
          payload.newSalary = Number(v('newSalary'));
        } else if (movement.type === 'AUMENTO_QUADRO') {
          payload.positionId = v('positionId');
          payload.directorateId = v('directorateId');
          payload.costCenterId = v('costCenterId');
          payload.quantity = Number(v('quantity'));
          payload.plannedSalary = Number(v('plannedSalary'));
        }

        var btn = document.getElementById('mov-edit-save-btn');
        btn.disabled = true;
        btn.classList.add('is-loading');
        callApi('api_updateMovement', movement.id, payload)
          .then(function () {
            toast('Movimentação atualizada — simulação recalculada.', 'success');
            state.editing = false;
            Views.movementDetail(root, movement.id);
          })
          .catch(function (err) {
            toastError(err);
            btn.disabled = false;
            btn.classList.remove('is-loading');
          });
      });
    }

    function render(movement) {
      var showEditBtn = canEditMovement(movement) && !state.editing;
      root.innerHTML =
        '<div class="page-header"><div><a href="#" data-route="#/movements" class="text-xs text-faint">← Voltar para Movimentações</a>' +
        '<div class="row" style="margin-top:4px;gap:10px;"><h1>' +
        escapeHtml(labelFor('movementType', movement.type)) +
        '</h1>' +
        badge('movementStatus', movement.status) +
        '</div><p>' +
        escapeHtml(movement.employeeName || movement.directorateName || 'Aumento de quadro / vaga') +
        '</p></div>' +
        '<div class="row">' +
        (showEditBtn ? '<button class="btn btn-outline" id="mov-edit-btn">Editar</button>' : '') +
        (movement.status === 'RASCUNHO'
          ? '<button class="btn btn-outline" id="mov-cancel-btn">Cancelar Rascunho</button><button class="btn" id="mov-submit-btn">Submeter para Aprovação</button>'
          : '') +
        '</div></div>' +
        (state.editing ? editFormHtml(movement) : dataCardHtml(movement)) +
        '<div style="height:16px;"></div>' +
        cardOpen('Simulador de Impacto', {
          subtitle: 'Impacto financeiro projetado para esta movimentação.',
          actions: '<button class="btn btn-outline btn-sm" id="mov-simulate-btn">' + (movement.simulation ? 'Recalcular' : 'Executar Simulação') + '</button>',
        }) +
        '<div id="mov-sim-body">' +
        simulationPanelHtml(movement.simulation) +
        '</div>' +
        cardClose() +
        '<div style="height:16px;"></div>' +
        cardOpen('Linha do Tempo de Aprovação') +
        approvalTimelineHtml(movement.approvalSteps) +
        cardClose();

      var editBtn = document.getElementById('mov-edit-btn');
      if (editBtn) {
        editBtn.addEventListener('click', function () {
          state.editing = true;
          render(movement);
        });
      }
      if (state.editing) wireEditForm(movement);

      var simulateBtn = document.getElementById('mov-simulate-btn');
      simulateBtn.addEventListener('click', function () {
        simulateBtn.disabled = true;
        simulateBtn.classList.add('is-loading');
        callApi('api_simulateMovement', movement.id)
          .then(function (sim) {
            document.getElementById('mov-sim-body').innerHTML = simulationPanelHtml(sim);
            simulateBtn.textContent = 'Recalcular';
          })
          .catch(toastError)
          .finally(function () {
            simulateBtn.disabled = false;
            simulateBtn.classList.remove('is-loading');
          });
      });

      var submitBtn = document.getElementById('mov-submit-btn');
      if (submitBtn) {
        submitBtn.addEventListener('click', function () {
          submitBtn.disabled = true;
          submitBtn.classList.add('is-loading');
          callApi('api_submitMovement', movement.id)
            .then(function () {
              toast('Movimentação submetida para aprovação.', 'success');
              Views.movementDetail(root, movement.id);
            })
            .catch(function (err) {
              toastError(err);
              submitBtn.disabled = false;
              submitBtn.classList.remove('is-loading');
            });
        });
      }

      var cancelBtn = document.getElementById('mov-cancel-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function () {
          confirmAction('Tem certeza que deseja cancelar este rascunho de movimentação?', function () {
            callApi('api_cancelMovement', movement.id)
              .then(function () {
                toast('Movimentação cancelada.', 'success');
                Views.movementDetail(root, movement.id);
              })
              .catch(toastError);
          }, { danger: true, confirmLabel: 'Cancelar Movimentação' });
        });
      }
    }
  };

  // -----------------------------------------------------------------------
  // Simulador Rápido (Módulo 4) — Gestor/Diretor testa o impacto de uma
  // promoção/mérito antes de abrir a solicitação de fato. Não persiste
  // nada; "Abrir solicitação com estes dados" leva para Views.movementNew
  // já preenchido (ver App.movementPrefill).
  // -----------------------------------------------------------------------
  Views.simulator = function (root) {
    var org, employees;
    var type = 'PROMOCAO';
    var employeePicker = null;

    root.innerHTML = loadingHtml();

    Promise.all([getOrgLookups(), callApi('api_listEmployees', { status: 'ATIVO' })])
      .then(function (results) {
        org = results[0];
        employees = results[1] || [];
        render();
      })
      .catch(function (err) {
        root.innerHTML = errorStateHtml(apiErrorMessage(err));
      });

    function render() {
      root.innerHTML =
        '<div class="page-header"><div><h1>Simulador Rápido</h1>' +
        '<p>Simule o impacto de uma promoção ou mérito para um dos seus colaboradores antes de abrir a solicitação de fato.</p></div></div>' +
        cardOpen() +
        '<div class="field"><label>Tipo <span class="req">*</span></label><select id="sim-type">' +
        optionsHtml(
          [
            { id: 'PROMOCAO', name: LABELS.movementType.PROMOCAO },
            { id: 'MERITO', name: LABELS.movementType.MERITO },
          ],
          { selected: type }
        ) +
        '</select></div>' +
        '<div class="field"><label>Colaborador <span class="req">*</span></label><div id="sim-employee-picker"></div>' +
        '<p class="field-error" id="sim-err-employee" style="display:none;"></p></div>' +
        '<div id="sim-type-fields"></div>' +
        '<div class="field" style="margin-top:14px;"><label>Data Efetiva <span class="req">*</span></label>' +
        '<input type="date" id="sim-effectiveDate" style="max-width:220px;">' +
        '<p class="field-error" id="sim-err-effectiveDate" style="display:none;"></p></div>' +
        '<div class="form-actions"><button class="btn" id="sim-run-btn">Simular</button></div>' +
        cardClose() +
        '<div style="height:16px;"></div>' +
        '<div id="sim-result"></div>';

      document.getElementById('sim-type').addEventListener('change', function (e) {
        type = e.target.value;
        renderTypeFields();
      });
      document.getElementById('sim-run-btn').addEventListener('click', runSimulation);
      employeePicker = mountEmployeePicker(document.getElementById('sim-employee-picker'), employees, {
        onChange: function () {
          renderTypeFields();
        },
      });
      renderTypeFields();
    }

    var simSalaryPercentSync = null;

    function updateSimSalaryHint() {
      var hint = document.getElementById('sim-hint-newSalary');
      var emp = employeePicker && employeePicker.getSelected();
      if (hint) hint.textContent = reajusteHintText_(emp);
      if (simSalaryPercentSync) simSalaryPercentSync.refresh();
    }

    function renderTypeFields() {
      var el = document.getElementById('sim-type-fields');
      if (type === 'PROMOCAO') {
        el.innerHTML =
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Cargo <span class="req">*</span></label><select id="sim-newPositionId">' +
          optionsHtml(org.positions, { placeholder: 'Selecione' }) +
          '</select><p class="field-error" id="sim-err-newPositionId" style="display:none;"></p></div>' +
          '<div class="field"><label>Novo Salário <span class="req">*</span></label><input type="number" step="0.01" id="sim-newSalary">' +
          '<p class="field-hint" id="sim-hint-newSalary"></p><p class="field-error" id="sim-err-newSalary" style="display:none;"></p></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="sim-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>';
      } else {
        el.innerHTML =
          '<div class="form-grid">' +
          '<div class="field"><label>Novo Salário <span class="req">*</span></label><input type="number" step="0.01" id="sim-newSalary">' +
          '<p class="field-hint" id="sim-hint-newSalary"></p><p class="field-error" id="sim-err-newSalary" style="display:none;"></p></div>' +
          '<div class="field"><label>Percentual de Reajuste (%)</label><input type="number" step="0.01" id="sim-newPercent">' +
          '<p class="field-hint">Preencha um dos dois — o outro é calculado automaticamente.</p></div>' +
          '</div>';
      }
      var salEl = document.getElementById('sim-newSalary');
      if (salEl) salEl.addEventListener('input', updateSimSalaryHint);
      simSalaryPercentSync = wireSalaryPercentSync_('sim-newSalary', 'sim-newPercent', function () {
        var emp = employeePicker && employeePicker.getSelected();
        return emp ? Number(emp.currentSalary) : null;
      });
      updateSimSalaryHint();
    }

    function clearErrors() {
      root.querySelectorAll('.field-error').forEach(function (e) {
        e.style.display = 'none';
        e.textContent = '';
      });
    }
    function setError(id, message) {
      var el = document.getElementById('sim-err-' + id);
      if (el) {
        el.textContent = message;
        el.style.display = 'block';
      }
    }

    function runSimulation() {
      clearErrors();
      var emp = employeePicker && employeePicker.getSelected();
      var effectiveDate = document.getElementById('sim-effectiveDate').value;
      var errors = {};
      if (!emp) errors.employee = 'Selecione o colaborador.';
      if (!effectiveDate) errors.effectiveDate = 'Informe a data efetiva.';

      var input = { type: type, employeeId: emp ? emp.id : null, effectiveDate: effectiveDate };
      var newSalary = document.getElementById('sim-newSalary').value;
      if (type === 'PROMOCAO') {
        var newPositionId = document.getElementById('sim-newPositionId').value;
        if (!newPositionId) errors.newPositionId = 'Selecione o novo cargo.';
        if (!newSalary) errors.newSalary = 'Informe o novo salário.';
        if (emp && newSalary && Number(newSalary) < Number(emp.currentSalary)) {
          errors.newSalary = 'O novo salário não pode ser menor que o salário atual (' + fmt.currency(emp.currentSalary) + ').';
        }
        input.newPositionId = newPositionId;
        input.newSalary = Number(newSalary);
      } else {
        if (!newSalary) errors.newSalary = 'Informe o novo salário.';
        if (emp && newSalary && Number(newSalary) <= Number(emp.currentSalary)) {
          errors.newSalary = 'O novo salário precisa ser maior que o salário atual (' + fmt.currency(emp.currentSalary) + ').';
        }
        input.newSalary = Number(newSalary);
      }

      if (Object.keys(errors).length > 0) {
        Object.keys(errors).forEach(function (key) {
          setError(key, errors[key]);
        });
        return;
      }

      var btn = document.getElementById('sim-run-btn');
      btn.disabled = true;
      btn.classList.add('is-loading');
      callApi('api_previewSimulation', input)
        .then(function (result) {
          renderResult(result, input);
        })
        .catch(toastError)
        .finally(function () {
          btn.disabled = false;
          btn.classList.remove('is-loading');
        });
    }

    function renderResult(result, input) {
      var wrap = document.getElementById('sim-result');
      wrap.innerHTML =
        cardOpen('Resultado da Simulação', {
          actions: '<button class="btn btn-outline btn-sm" id="sim-open-movement-btn">Abrir solicitação com estes dados</button>',
        }) +
        simulationPanelHtml(result) +
        cardClose();

      document.getElementById('sim-open-movement-btn').addEventListener('click', function () {
        App.movementPrefill = input;
        goTo('#/movements/new');
      });
    }
  };
</script>
