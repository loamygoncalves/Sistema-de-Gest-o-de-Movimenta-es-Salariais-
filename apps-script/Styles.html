<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap">
<style>
  /* =====================================================================
     SGMS — Design system (Apps Script HtmlService)
     Paleta Beep Saúde (teal + laranja + cinza neutro) — ver
     assets/brand/BRAND.md para a especificação oficial. Sem dependências
     externas além da Google Font Raleway carregada acima.
     ===================================================================== */
  :root {
    /* --brand-*: teal Beep (#00AFAA), com --brand-400 = variante clara
       (#04D4CE) e --brand-700 = variante escura/hover (#008E87). */
    --brand-50: #e3f8f7;
    --brand-100: #c6f0ee;
    --brand-200: #93e3df;
    --brand-300: #5dd8d3;
    --brand-400: #04d4ce;
    --brand-500: #00afaa;
    --brand-600: #00afaa;
    --brand-700: #008e87;
    --brand-800: #007068;
    --brand-900: #00524c;

    --slate-50: #f4f4f4;
    --slate-100: #ecedee;
    --slate-200: #e5e5e5;
    --slate-300: #cdd1d3;
    --slate-400: #a6adb1;
    --slate-500: #808a90;
    --slate-600: #66727a;
    --slate-700: #5c6a73;
    --slate-800: #56636d;
    --slate-900: #4f5e69;

    /* Sucesso/Aprovado: verde distinto do teal de marca (ação primária). */
    --green-50: #eafbf3;
    --green-100: #cff3e1;
    --green-600: #1f9d6c;
    --green-700: #167a54;

    /* Erro/Reprovado: vermelho neutro de sistema (a marca não define um
       vermelho próprio para erro). */
    --red-50: #fef2f2;
    --red-100: #fee2e2;
    --red-600: #dc2626;
    --red-700: #b91c1c;

    /* Alerta/Pendente: laranja Beep (#FBA600) — único laranja da marca. */
    --amber-50: #fff6e6;
    --amber-100: #ffe9be;
    --amber-600: #fba600;
    --amber-700: #8f5b00;

    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --blue-600: #2563eb;
    --blue-700: #1d4ed8;

    --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.06);
    --shadow-modal: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --sidebar-w: 248px;
    --topbar-h: 60px;
    --font-sans: 'Raleway', -apple-system, 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--slate-50);
    color: var(--slate-900);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    min-height: 100%;
  }

  a {
    color: var(--brand-600);
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }

  h1,
  h2,
  h3,
  h4 {
    margin: 0;
    font-weight: 600;
    color: var(--slate-900);
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: 20px;
  }
  h2 {
    font-size: 17px;
  }
  h3 {
    font-size: 15px;
  }
  h4 {
    font-size: 13px;
  }
  p {
    margin: 0;
  }

  .text-xs {
    font-size: 12px;
  }
  .text-sm {
    font-size: 13px;
  }
  .text-muted {
    color: var(--slate-500);
  }
  .text-faint {
    color: var(--slate-400);
  }
  .uppercase-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-400);
  }
  .mono {
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------------
     App shell: sidebar + topbar
     --------------------------------------------------------------------- */
  .shell {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--slate-900);
    color: var(--slate-200);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    overflow-y: auto;
    z-index: 20;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 20px;
    background: #fff;
    border-bottom: 2px solid var(--brand-100);
  }
  .sidebar-brand-logo {
    height: 46px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  .sidebar-brand-text {
    line-height: 1.15;
  }
  .sidebar-brand-name {
    display: block;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.02em;
    color: var(--brand-700);
  }
  .sidebar-brand-sub {
    display: block;
    font-weight: 600;
    font-size: 13px;
    color: var(--slate-500);
    margin-top: 1px;
  }

  .sidebar-nav {
    flex: 1;
    padding: 10px 12px 20px;
  }
  .nav-group {
    margin-top: 16px;
  }
  .nav-group:first-child {
    margin-top: 4px;
  }
  .nav-group-title {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--slate-500);
    padding: 0 10px 6px;
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    color: var(--slate-300);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .nav-link:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    text-decoration: none;
  }
  .nav-link.active {
    background: var(--brand-600);
    color: #fff;
  }
  .nav-link .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
    flex-shrink: 0;
  }

  .main-col {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    height: var(--topbar-h);
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid var(--slate-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--slate-900);
  }
  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--brand-100);
    color: var(--brand-700);
    font-weight: 700;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .topbar-user-meta {
    line-height: 1.25;
  }
  .topbar-user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-800);
  }
  .topbar-user-role {
    font-size: 11.5px;
    color: var(--slate-500);
  }

  .view-root {
    flex: 1;
    padding: 24px;
    max-width: 1400px;
    width: 100%;
  }

  @media (max-width: 900px) {
    .sidebar {
      width: 76px;
    }
    .sidebar-brand-text,
    .nav-group-title,
    .nav-link span.label {
      display: none;
    }
    .sidebar-brand {
      justify-content: center;
      padding: 14px 8px;
    }
    .sidebar-brand-logo {
      height: 22px;
    }
    .main-col {
      margin-left: 76px;
    }
    .nav-link {
      justify-content: center;
    }
  }

  /* ---------------------------------------------------------------------
     Layout helpers
     --------------------------------------------------------------------- */
  .page-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .page-header p {
    margin-top: 2px;
    color: var(--slate-500);
    font-size: 13px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .grid {
    display: grid;
    gap: 16px;
  }
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  @media (max-width: 1100px) {
    .grid-4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 700px) {
    .grid-2,
    .grid-3,
    .grid-4 {
      grid-template-columns: 1fr;
    }
  }
  .spacer {
    flex: 1;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--slate-200);
    margin: 16px 0;
  }

  /* ---------------------------------------------------------------------
     Cards
     --------------------------------------------------------------------- */
  .card {
    background: #fff;
    border: 1px solid var(--slate-200);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 20px;
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .card-header h3 {
    margin-bottom: 2px;
  }
  .card-subtitle {
    color: var(--slate-500);
    font-size: 12.5px;
  }
  .card-flush {
    padding: 0;
    overflow: hidden;
  }

  .kpi-tile {
    background: #fff;
    border: 1px solid var(--slate-200);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .kpi-tile.highlight {
    background: var(--brand-50);
    border-color: var(--brand-200);
  }
  .kpi-tile.warn {
    background: var(--amber-50);
    border-color: #ffd699;
  }
  .kpi-tile.danger {
    background: var(--red-50);
    border-color: #fecaca;
  }
  .kpi-tile.good {
    background: var(--green-50);
    border-color: #a7f3d0;
  }
  .kpi-label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate-500);
  }
  .kpi-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--slate-900);
  }
  .kpi-tile.highlight .kpi-value {
    color: var(--brand-700);
  }
  .kpi-tile.danger .kpi-value {
    color: var(--red-700);
  }
  .kpi-tile.good .kpi-value {
    color: var(--green-700);
  }
  .kpi-hint {
    font-size: 12px;
    color: var(--slate-400);
  }

  /* ---------------------------------------------------------------------
     Buttons
     --------------------------------------------------------------------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s;
    background: var(--brand-600);
    color: #fff;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--brand-700);
    text-decoration: none;
  }
  .btn:disabled,
  .btn.is-loading {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .btn-outline {
    background: #fff;
    color: var(--slate-700);
    border-color: var(--slate-300);
  }
  .btn-outline:hover {
    background: var(--slate-50);
    border-color: var(--slate-400);
  }
  .btn-danger {
    background: var(--red-600);
  }
  .btn-danger:hover {
    background: var(--red-700);
  }
  .btn-success {
    background: var(--green-600);
  }
  .btn-success:hover {
    background: var(--green-700);
  }
  .btn-ghost {
    background: transparent;
    color: var(--slate-600);
  }
  .btn-ghost:hover {
    background: var(--slate-100);
  }
  .btn-sm {
    padding: 5px 10px;
    font-size: 12px;
  }
  .btn-icon {
    padding: 6px;
    width: 30px;
    height: 30px;
  }

  /* ---------------------------------------------------------------------
     Forms
     --------------------------------------------------------------------- */
  label,
  .field-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--slate-700);
    display: block;
    margin-bottom: 5px;
  }
  .field-label .req {
    color: var(--red-600);
  }
  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="email"],
  input[type="search"],
  input[type="file"],
  select,
  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--slate-300);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--slate-900);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--brand-500);
    box-shadow: 0 0 0 3px var(--brand-100);
  }
  textarea {
    resize: vertical;
    min-height: 72px;
  }
  .field {
    margin-bottom: 14px;
  }
  .field:last-child {
    margin-bottom: 0;
  }
  .field-error {
    color: var(--red-600);
    font-size: 12px;
    margin-top: 4px;
  }
  .field-hint {
    color: var(--slate-400);
    font-size: 12px;
    margin-top: 4px;
  }
  .field.has-error input,
  .field.has-error select,
  .field.has-error textarea {
    border-color: var(--red-600);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px 16px;
  }
  @media (max-width: 700px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--slate-200);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checkbox-row input[type="checkbox"] {
    width: auto;
  }
  .checkbox-row label {
    margin-bottom: 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--slate-200);
    margin-bottom: 18px;
  }
  .tab-btn {
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-500);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab-btn:hover {
    color: var(--slate-800);
  }
  .tab-btn.active {
    color: var(--brand-700);
    border-bottom-color: var(--brand-600);
  }

  /* ---------------------------------------------------------------------
     Tables
     --------------------------------------------------------------------- */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--slate-200);
    border-radius: var(--radius-md);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
    font-size: 13px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--slate-50);
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate-500);
    padding: 10px 14px;
    border-bottom: 1px solid var(--slate-200);
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--slate-100);
    color: var(--slate-800);
    vertical-align: middle;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody tr.clickable {
    cursor: pointer;
  }
  tbody tr.clickable:hover {
    background: var(--slate-50);
  }
  .table-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--slate-400);
    font-size: 13px;
  }
  .cell-num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------------
     Pills / badges
     --------------------------------------------------------------------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-slate {
    background: var(--slate-100);
    color: var(--slate-700);
  }
  .pill-green {
    background: var(--green-100);
    color: var(--green-700);
  }
  .pill-red {
    background: var(--red-100);
    color: var(--red-700);
  }
  .pill-amber {
    background: var(--amber-100);
    color: var(--amber-700);
  }
  .pill-blue {
    background: var(--blue-100);
    color: var(--blue-700);
  }
  .pill-teal {
    background: var(--brand-100);
    color: var(--brand-700);
  }

  /* ---------------------------------------------------------------------
     Alerts / banners
     --------------------------------------------------------------------- */
  .banner {
    border-radius: var(--radius-md);
    border: 1px solid var(--slate-200);
    background: var(--slate-50);
    color: var(--slate-700);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
  }
  .banner-danger {
    background: var(--red-50);
    border-color: #fecaca;
    color: var(--red-700);
  }
  .banner-success {
    background: var(--green-50);
    border-color: #a7f3d0;
    color: var(--green-700);
  }
  .banner-warn {
    background: var(--amber-50);
    border-color: #ffd699;
    color: var(--amber-700);
  }
  .banner-info {
    background: var(--blue-50);
    border-color: #bfdbfe;
    color: var(--blue-700);
  }

  /* ---------------------------------------------------------------------
     Toasts
     --------------------------------------------------------------------- */
  .toast-stack {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 340px;
  }
  .toast {
    background: var(--slate-900);
    color: #fff;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-modal);
    animation: toast-in 0.15s ease-out;
  }
  .toast-success {
    background: var(--green-700);
  }
  .toast-error {
    background: var(--red-700);
  }
  .toast-info {
    background: var(--brand-700);
  }
  @keyframes toast-in {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---------------------------------------------------------------------
     Modal
     --------------------------------------------------------------------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(38, 46, 51, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
    padding: 20px;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-modal);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .modal-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--slate-400);
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
  }
  .modal-close:hover {
    color: var(--slate-700);
  }

  /* ---------------------------------------------------------------------
     Misc: spinner, empty state, timeline, access screens
     --------------------------------------------------------------------- */
  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid var(--slate-200);
    border-top-color: var(--brand-600);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .loading-row {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--slate-500);
    padding: 24px;
    justify-content: center;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--slate-500);
  }
  .empty-state .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .full-screen-msg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
