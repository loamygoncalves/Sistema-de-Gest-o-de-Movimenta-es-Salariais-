<script>
  /* =====================================================================
     Módulo 2 — Base de colaboradores
     api_listEmployees / api_getEmployee / api_createEmployee /
     api_updateEmployee / api_deactivateEmployee / api_importEmployees /
     api_getEmployeesComparison
     ===================================================================== */

  function employeeFormFieldsHtml(org, values, prefix) {
    values = values || {};
    prefix = prefix || 'emp';
    return (
      '<div class="form-grid">' +
      '<div class="field"><label>Matrícula <span class="req">*</span></label>' +
      '<input type="text" id="' + prefix + '-registration" value="' + escapeHtml(values.registration || '') + '"></div>' +
      '<div class="field"><label>Nome <span class="req">*</span></label>' +
      '<input type="text" id="' + prefix + '-name" value="' + escapeHtml(values.name || '') + '"></div>' +
      '<div class="field"><label>Cargo <span class="req">*</span></label>' +
      '<select id="' + prefix + '-positionId">' + optionsHtml(org.positions, { placeholder: 'Selecione', selected: values.positionId }) + '</select></div>' +
      '<div class="field"><label>Diretoria <span class="req">*</span></label>' +
      '<select id="' + prefix + '-directorateId">' + optionsHtml(org.directorates, { placeholder: 'Selecione', selected: values.directorateId }) + '</select></div>' +
      '<div class="field"><label>Gerência</label>' +
      '<select id="' + prefix + '-managementId">' + optionsHtml(org.managements, { placeholder: '—', selected: values.managementId }) + '</select></div>' +
      '<div class="field"><label>Coordenação</label>' +
      '<select id="' + prefix + '-coordinationId">' + optionsHtml(org.coordinations, { placeholder: '—', selected: values.coordinationId }) + '</select></div>' +
      '<div class="field"><label>Centro de Custo</label>' +
      '<select id="' + prefix + '-costCenterId">' + optionsHtml(org.costCenters, { placeholder: '—', selected: values.costCenterId }) + '</select></div>' +
      '<div class="field"><label>Tipo de Contrato</label>' +
      '<select id="' + prefix + '-contractType">' +
      optionsHtml(
        Object.keys(LABELS.contractType).map(function (k) {
          return { id: k, name: LABELS.contractType[k] };
        }),
        { selected: values.contractType || 'CLT' }
      ) +
      '</select></div>' +
      '<div class="field"><label>Cidade</label><input type="text" id="' + prefix + '-city" value="' + escapeHtml(values.city || '') + '"></div>' +
      '<div class="field"><label>Estado (UF)</label><input type="text" id="' + prefix + '-state" maxlength="2" value="' + escapeHtml(values.state || '') + '"></div>' +
      '<div class="field"><label>Data de Admissão <span class="req">*</span></label>' +
      '<input type="date" id="' + prefix + '-admissionDate" value="' + escapeHtml(values.admissionDate ? String(values.admissionDate).slice(0, 10) : '') + '"></div>' +
      '<div class="field"><label>Salário Atual <span class="req">*</span></label>' +
      '<input type="number" step="0.01" id="' + prefix + '-currentSalary" value="' + (values.currentSalary != null ? values.currentSalary : '') + '"></div>' +
      '<div class="field"><label>Status</label>' +
      '<select id="' + prefix + '-status">' +
      optionsHtml(
        Object.keys(LABELS.employeeStatus).map(function (k) {
          return { id: k, name: LABELS.employeeStatus[k] };
        }),
        { selected: values.status || 'ATIVO' }
      ) +
      '</select></div>' +
      '</div>'
    );
  }

  function readEmployeeFormValues(prefix) {
    function v(id) {
      var el = document.getElementById(prefix + '-' + id);
      return el ? el.value : '';
    }
    return {
      registration: v('registration').trim(),
      name: v('name').trim(),
      positionId: v('positionId'),
      directorateId: v('directorateId'),
      managementId: v('managementId'),
      coordinationId: v('coordinationId'),
      costCenterId: v('costCenterId'),
      contractType: v('contractType'),
      city: v('city').trim(),
      state: v('state').trim().toUpperCase(),
      admissionDate: v('admissionDate'),
      currentSalary: v('currentSalary'),
      status: v('status'),
    };
  }

  function validateEmployeeForm(values) {
    if (!values.registration) return 'Matrícula é obrigatória.';
    if (!values.name) return 'Nome é obrigatório.';
    if (!values.positionId) return 'Selecione o cargo.';
    if (!values.directorateId) return 'Selecione a diretoria.';
    if (!values.admissionDate) return 'Informe a data de admissão.';
    if (values.currentSalary === '' || isNaN(Number(values.currentSalary)) || Number(values.currentSalary) < 0) {
      return 'Informe um salário atual válido.';
    }
    return null;
  }

  Views.employees = function (root) {
    var user = App.user;
    var canEdit = canManage(user);
    var state = {
      directorateId: isScopedRole(user) ? user.directorateId || '' : '',
      positionId: '',
      status: '',
      search: '',
      tab: 'list',
      year: new Date().getFullYear(),
    };

    var tabs = [{ key: 'list', label: 'Colaboradores' }];
    if (canEdit) tabs.push({ key: 'import', label: 'Fechamento da Folha' });
    tabs.push({ key: 'comparison', label: 'Comparativo Orçado x Atual' });

    root.innerHTML =
      '<div class="page-header"><div><h1>Colaboradores</h1><p>Base atual de colaboradores e comparação com o orçamento.</p></div>' +
      (canEdit ? '<button class="btn" id="emp-new-btn">+ Novo Colaborador</button>' : '') +
      '</div>' +
      '<div class="tabs" id="emp-tabs"></div>' +
      '<div id="emp-body">' +
      loadingHtml() +
      '</div>';

    function renderTabs() {
      var el = document.getElementById('emp-tabs');
      el.innerHTML = tabs
        .map(function (t) {
          return '<button class="tab-btn' + (state.tab === t.key ? ' active' : '') + '" data-tab="' + t.key + '">' + escapeHtml(t.label) + '</button>';
        })
        .join('');
      el.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.tab = btn.getAttribute('data-tab');
          renderTabs();
          renderTabBody();
        });
      });
    }

    function renderTabBody() {
      if (state.tab === 'list') renderListTab();
      else if (state.tab === 'import') renderImportTab();
      else if (state.tab === 'comparison') renderComparisonTab();
    }

    function renderListTab() {
      var body = document.getElementById('emp-body');
      var org = App.orgLookups;
      var directorateFilterHtml = '';
      if (!isScopedRole(user)) {
        directorateFilterHtml =
          '<div class="col"><label>Diretoria</label><select id="emp-f-directorate"><option value="">Todas</option>' +
          optionsHtml(org.directorates, { selected: state.directorateId }) +
          '</select></div>';
      }
      body.innerHTML =
        '<div class="filter-bar">' +
        directorateFilterHtml +
        '<div class="col"><label>Cargo</label><select id="emp-f-position"><option value="">Todos</option>' +
        optionsHtml(org.positions, { selected: state.positionId }) +
        '</select></div>' +
        '<div class="col"><label>Status</label><select id="emp-f-status"><option value="">Todos</option>' +
        optionsHtml(
          Object.keys(LABELS.employeeStatus).map(function (k) {
            return { id: k, name: LABELS.employeeStatus[k] };
          }),
          { selected: state.status }
        ) +
        '</select></div>' +
        '<div class="col" style="min-width:220px;"><label>Buscar (nome/matrícula)</label><input type="search" id="emp-f-search" value="' +
        escapeHtml(state.search) +
        '" placeholder="Digite para buscar..."></div>' +
        '</div><div id="emp-table-wrap">' +
        loadingHtml() +
        '</div>';

      var dirEl = document.getElementById('emp-f-directorate');
      if (dirEl) dirEl.addEventListener('change', function (e) { state.directorateId = e.target.value; loadList(); });
      document.getElementById('emp-f-position').addEventListener('change', function (e) { state.positionId = e.target.value; loadList(); });
      document.getElementById('emp-f-status').addEventListener('change', function (e) { state.status = e.target.value; loadList(); });
      var searchTimer = null;
      document.getElementById('emp-f-search').addEventListener('input', function (e) {
        var val = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          state.search = val;
          loadList();
        }, 300);
      });

      loadList();
    }

    function loadList() {
      var wrap = document.getElementById('emp-table-wrap');
      if (!wrap) return;
      wrap.innerHTML = loadingHtml();
      callApi('api_listEmployees', {
        directorateId: state.directorateId || undefined,
        positionId: state.positionId || undefined,
        status: state.status || undefined,
        search: state.search || undefined,
      })
        .then(function (list) {
          if (!list || list.length === 0) {
            wrap.innerHTML = emptyStateHtml('Nenhum colaborador encontrado com os filtros atuais.');
            return;
          }
          wrap.innerHTML =
            '<div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Nome</th><th>Cargo</th><th>Diretoria</th>' +
            '<th>Contrato</th><th>Admissão</th><th class="cell-num">Salário Atual</th><th>Status</th></tr></thead><tbody>' +
            list
              .map(function (e) {
                return (
                  '<tr class="clickable" data-route="#/employees/' +
                  e.id +
                  '"><td>' +
                  escapeHtml(e.registration) +
                  '</td><td>' +
                  escapeHtml(e.name) +
                  '</td><td>' +
                  escapeHtml(e.positionName || '—') +
                  '</td><td>' +
                  escapeHtml(e.directorateName || '—') +
                  '</td><td>' +
                  escapeHtml(labelFor('contractType', e.contractType)) +
                  '</td><td>' +
                  fmt.date(e.admissionDate) +
                  '</td><td class="cell-num">' +
                  fmt.currency(e.currentSalary) +
                  '</td><td>' +
                  badge('employeeStatus', e.status) +
                  '</td></tr>'
                );
              })
              .join('') +
            '</tbody></table></div>';
        })
        .catch(function (err) {
          wrap.innerHTML = errorStateHtml(apiErrorMessage(err));
        });
    }

    function renderImportTab() {
      var body = document.getElementById('emp-body');
      body.innerHTML =
        cardOpen('Fechamento mensal da folha', {
          subtitle: 'Colunas: Matrícula, Nome, Cargo, Centro de Custo, Admissão, Salário Atual, Mês de Referência (MM/AAAA, ex.: 08/2026). A diretoria é derivada do centro de custo. Além de atualizar o salário e o centro de custo atuais de cada colaborador, o sistema guarda um retrato do mês informado na planilha para que relatórios de meses passados não sejam substituídos pelo salário mais recente.',
        }) +
        '<div class="field"><label>Arquivo (.csv ou .xlsx)</label><input type="file" id="emp-import-file" accept=".csv,.xlsx"></div>' +
        '<div class="form-actions"><button class="btn" id="emp-import-btn">Fechar mês</button></div>' +
        '<div id="emp-import-result" style="margin-top:16px;"></div>' +
        cardClose();

      document.getElementById('emp-import-btn').addEventListener('click', function () {
        var btn = this;
        var fileInput = document.getElementById('emp-import-file');
        var file = fileInput.files[0];
        if (!file) {
          toast('Selecione um arquivo para importar.', 'error');
          return;
        }
        btn.disabled = true;
        btn.classList.add('is-loading');
        readFileAsBase64(file)
          .then(function (base64) {
            return callApi('api_importEmployees', base64, file.type || 'text/csv', file.name);
          })
          .then(function (result) {
            document.getElementById('emp-import-result').innerHTML = renderImportResultHtml(result);
            toast('Fechamento importado: ' + result.successRows + ' de ' + result.totalRows + ' linha(s).', result.errors.length > 0 ? 'info' : 'success');
          })
          .catch(function (err) {
            toastError(err);
          })
          .finally(function () {
            btn.disabled = false;
            btn.classList.remove('is-loading');
          });
      });
    }

    function comparisonItemRow(item) {
      var typeLabel = item.type === 'VAGA_ABERTA' ? 'Vaga em Aberto' : 'Excesso de HC';
      var typeClass = item.type === 'VAGA_ABERTA' ? 'pill-blue' : 'pill-red';
      return (
        '<tr><td><span class="pill ' +
        typeClass +
        '">' +
        typeLabel +
        '</span></td><td>' +
        escapeHtml(item.directorate || '—') +
        '</td><td>' +
        escapeHtml(item.costCenter || '—') +
        '</td><td class="cell-num">' +
        fmt.number(item.budgetedCount) +
        '</td><td class="cell-num">' +
        fmt.number(item.currentCount) +
        '</td><td class="cell-num">' +
        fmt.currency(item.budgetedCost) +
        '</td><td class="cell-num">' +
        fmt.currency(item.currentCost) +
        '</td></tr>'
      );
    }

    function renderComparisonTab() {
      var body = document.getElementById('emp-body');
      var now = new Date();
      if (!state.month) state.month = now.getMonth() + 1;
      body.innerHTML =
        '<div class="filter-bar">' +
        '<div class="col"><label>Ano</label><input type="number" id="emp-cmp-year" value="' + state.year + '" style="width:110px;"></div>' +
        '<div class="col"><label>Mês de referência</label><select id="emp-cmp-month">' +
        optionsHtml(
          ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'].map(function (label, i) {
            return { id: i + 1, name: label };
          }),
          { selected: state.month },
        ) +
        '</select></div>' +
        '</div><div id="emp-cmp-body">' +
        loadingHtml() +
        '</div>';
      document.getElementById('emp-cmp-year').addEventListener('change', function (e) {
        state.year = Number(e.target.value) || state.year;
        loadComparison();
      });
      document.getElementById('emp-cmp-month').addEventListener('change', function (e) {
        state.month = Number(e.target.value) || state.month;
        loadComparison();
      });
      loadComparison();
    }

    function loadComparison() {
      var wrap = document.getElementById('emp-cmp-body');
      if (!wrap) return;
      wrap.innerHTML = loadingHtml();
      callApi('api_getEmployeesComparison', state.year, state.month)
        .then(function (d) {
          var movementsByTypeHtml = Object.keys(d.movementsByType || {})
            .map(function (type) {
              return (
                '<div class="kpi-tile"><div class="kpi-label">' +
                escapeHtml(labelFor('plannedSituation', type)) +
                '</div><div class="kpi-value">' +
                fmt.number(d.movementsByType[type]) +
                '</div></div>'
              );
            })
            .join('');
          wrap.innerHTML =
            '<div class="grid grid-4">' +
            '<div class="kpi-tile"><div class="kpi-label">Headcount Orçado (mês)</div><div class="kpi-value">' + fmt.number(d.hcBudgeted) + '</div></div>' +
            '<div class="kpi-tile"><div class="kpi-label">Headcount Atual</div><div class="kpi-value">' + fmt.number(d.hcCurrent) + '</div></div>' +
            '<div class="kpi-tile"><div class="kpi-label">Vagas em Aberto</div><div class="kpi-value">' + fmt.number(d.openPositions) + '</div></div>' +
            '<div class="kpi-tile' + (d.headcountExcess > 0 ? ' danger' : '') + '"><div class="kpi-label">Excesso de Headcount</div><div class="kpi-value">' + fmt.number(d.headcountExcess) + '</div></div>' +
            '</div>' +
            '<div class="grid grid-2" style="margin-top:16px;">' +
            '<div class="kpi-tile good"><div class="kpi-label">Economia de Orçamento</div><div class="kpi-value">' + fmt.currency(d.budgetSavings) + '</div></div>' +
            '<div class="kpi-tile danger"><div class="kpi-label">Estouro de Orçamento</div><div class="kpi-value">' + fmt.currency(d.budgetOverrun) + '</div></div>' +
            '</div>' +
            '<div style="margin-top:20px;">' +
            cardOpen('Movimentações Orçadas no Mês', { subtitle: 'Quantidade de linhas de orçamento ativas no mês, por tipo de movimentação (informativo)' }) +
            '<div class="grid grid-3">' + movementsByTypeHtml + '</div>' +
            cardClose() +
            '</div>' +
            '<div style="margin-top:20px;">' +
            cardOpen('Itens de Atenção', { subtitle: 'Centros de custo com diferença entre vagas orçadas e colaboradores ativos' }) +
            (d.items && d.items.length > 0
              ? '<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Diretoria</th><th>Centro de Custo</th>' +
                '<th class="cell-num">Qtd. Orçada</th><th class="cell-num">Qtd. Atual</th><th class="cell-num">Custo Orçado</th><th class="cell-num">Custo Atual</th></tr></thead><tbody>' +
                d.items.map(comparisonItemRow).join('') +
                '</tbody></table></div>'
              : emptyStateHtml('Nenhum item pendente para o mês selecionado.', '✅')) +
            cardClose() +
            '</div>';
        })
        .catch(function (err) {
          wrap.innerHTML = errorStateHtml(apiErrorMessage(err));
        });
    }

    function openEmployeeModal(existing) {
      var org = App.orgLookups;
      var isNew = !existing;
      var html =
        '<div class="modal-header"><h3>' +
        (isNew ? 'Novo Colaborador' : 'Editar Colaborador') +
        '</h3><button class="modal-close" data-action="modal-close">&times;</button></div>' +
        employeeFormFieldsHtml(org, existing || {}, 'empmodal') +
        '<p class="field-error" id="empmodal-error" style="display:none;"></p>' +
        '<div class="form-actions"><button class="btn btn-outline" data-action="modal-close">Cancelar</button>' +
        '<button class="btn" id="empmodal-save-btn">Salvar</button></div>';
      var modalEl = Modal.open(html);
      modalEl.querySelector('#empmodal-save-btn').addEventListener('click', function () {
        var btn = this;
        var values = readEmployeeFormValues('empmodal');
        var validationError = validateEmployeeForm(values);
        var errEl = modalEl.querySelector('#empmodal-error');
        if (validationError) {
          errEl.textContent = validationError;
          errEl.style.display = 'block';
          return;
        }
        values.currentSalary = Number(values.currentSalary);
        btn.disabled = true;
        btn.classList.add('is-loading');
        var call = isNew ? callApi('api_createEmployee', values) : callApi('api_updateEmployee', existing.id, values);
        call
          .then(function () {
            Modal.close();
            toast(isNew ? 'Colaborador criado com sucesso.' : 'Colaborador atualizado com sucesso.', 'success');
            if (state.tab === 'list') loadList();
          })
          .catch(function (err) {
            errEl.textContent = apiErrorMessage(err);
            errEl.style.display = 'block';
          })
          .finally(function () {
            btn.disabled = false;
            btn.classList.remove('is-loading');
          });
      });
    }

    var newBtn = document.getElementById('emp-new-btn');
    if (newBtn) newBtn.addEventListener('click', function () { openEmployeeModal(null); });

    getOrgLookups()
      .then(function () {
        renderTabs();
        renderTabBody();
      })
      .catch(function (err) {
        document.getElementById('emp-body').innerHTML = errorStateHtml(apiErrorMessage(err));
      });
  };

  Views.employeeDetail = function (root, id) {
    var user = App.user;
    var canEdit = canManage(user);
    root.innerHTML = loadingHtml();

    Promise.all([callApi('api_getEmployee', id), getOrgLookups()])
      .then(function (results) {
        renderView(results[0]);
      })
      .catch(function (err) {
        root.innerHTML = errorStateHtml(apiErrorMessage(err));
      });

    function fieldRow(label, value) {
      return '<div><dt class="uppercase-label">' + escapeHtml(label) + '</dt><dd style="margin:2px 0 0;color:var(--slate-800);">' + value + '</dd></div>';
    }

    function renderView(employee) {
      root.innerHTML =
        '<div class="page-header">' +
        '<div><a href="#" data-route="#/employees" class="text-xs text-faint">← Voltar para Colaboradores</a>' +
        '<h1 style="margin-top:4px;">' +
        escapeHtml(employee.name) +
        '</h1><p>Matrícula ' +
        escapeHtml(employee.registration) +
        ' · ' +
        badge('employeeStatus', employee.status) +
        '</p></div>' +
        (canEdit
          ? '<div class="row">' +
            '<button class="btn btn-outline" id="emp-edit-btn">Editar</button>' +
            (employee.status !== 'INATIVO' ? '<button class="btn btn-danger" id="emp-deactivate-btn">Desativar</button>' : '') +
            '</div>'
          : '') +
        '</div>' +
        cardOpen('Dados do Colaborador') +
        '<dl class="grid grid-3" style="row-gap:14px;">' +
        fieldRow('Cargo', escapeHtml(employee.positionName || '—')) +
        fieldRow('Diretoria', escapeHtml(employee.directorateName || '—')) +
        fieldRow('Tipo de Contrato', escapeHtml(labelFor('contractType', employee.contractType))) +
        fieldRow('Cidade / UF', escapeHtml((employee.city || '—') + (employee.state ? ' / ' + employee.state : ''))) +
        fieldRow('Data de Admissão', fmt.date(employee.admissionDate)) +
        fieldRow('Salário Atual', fmt.currency(employee.currentSalary)) +
        '</dl>' +
        cardClose();

      var editBtn = document.getElementById('emp-edit-btn');
      if (editBtn) {
        editBtn.addEventListener('click', function () {
          renderEditForm(employee);
        });
      }
      var deactivateBtn = document.getElementById('emp-deactivate-btn');
      if (deactivateBtn) {
        deactivateBtn.addEventListener('click', function () {
          confirmAction(
            'Tem certeza que deseja desativar ' + employee.name + '? O colaborador deixará de aparecer em listagens ativas.',
            function () {
              callApi('api_deactivateEmployee', employee.id)
                .then(function () {
                  toast('Colaborador desativado.', 'success');
                  Views.employeeDetail(root, employee.id);
                })
                .catch(toastError);
            },
            { danger: true, confirmLabel: 'Desativar' }
          );
        });
      }
    }

    function renderEditForm(employee) {
      var org = App.orgLookups;
      root.innerHTML =
        '<div class="page-header"><div><a href="#" data-route="#/employees/' +
        employee.id +
        '" class="text-xs text-faint">← Cancelar edição</a><h1 style="margin-top:4px;">Editar Colaborador</h1></div></div>' +
        cardOpen() +
        employeeFormFieldsHtml(org, employee, 'empedit') +
        '<p class="field-error" id="empedit-error" style="display:none;"></p>' +
        '<div class="form-actions"><button class="btn btn-outline" data-route="#/employees/' +
        employee.id +
        '">Cancelar</button><button class="btn" id="empedit-save-btn">Salvar Alterações</button></div>' +
        cardClose();

      document.getElementById('empedit-save-btn').addEventListener('click', function () {
        var btn = this;
        var values = readEmployeeFormValues('empedit');
        var validationError = validateEmployeeForm(values);
        var errEl = document.getElementById('empedit-error');
        if (validationError) {
          errEl.textContent = validationError;
          errEl.style.display = 'block';
          return;
        }
        values.currentSalary = Number(values.currentSalary);
        btn.disabled = true;
        btn.classList.add('is-loading');
        callApi('api_updateEmployee', employee.id, values)
          .then(function () {
            toast('Colaborador atualizado com sucesso.', 'success');
            goTo('#/employees/' + employee.id);
          })
          .catch(function (err) {
            errEl.textContent = apiErrorMessage(err);
            errEl.style.display = 'block';
          })
          .finally(function () {
            btn.disabled = false;
            btn.classList.remove('is-loading');
          });
      });
    }
  };
</script>
