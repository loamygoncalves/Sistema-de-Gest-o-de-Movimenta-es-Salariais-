        })

          reject(error);
        });
      runner[fnName].apply(runner, args);
    });
  }

  function parseHash() {
    var hash = window.location.hash || '';
    var path = hash.replace(/^#/, '');
    if (!path || path === '/') path = '/dashboard';
    return path;
  }

  function matchRoute(path) {
    var parts = path.split('/').filter(Boolean);
    for (var i = 0; i < ROUTES.length; i++) {
      var route = ROUTES[i];
      if (route.segments.length !== parts.length) continue;
      var params = {};
      var ok = true;
      for (var j = 0; j < route.segments.length; j++) {
        var seg = route.segments[j];
        if (seg.charAt(0) === ':') {
          params[seg.slice(1)] = decodeURIComponent(parts[j]);
        } else if (seg !== parts[j]) {
          ok = false;
          break;
        }
      }
      if (ok) return { route: route, params: params };
    }
    return null;
  }

  /** Navega programaticamente (usado pelas views após criar/salvar registros). */
  function goTo(hash) {
    var clean = hash.replace(/^#/, '');
    if (parseHash() === clean) {
      renderRoute();
    } else {
      window.location.hash = clean;
    }
  }

  function updateActiveNav(path) {
    var links = document.querySelectorAll('#sidebar-nav .nav-link');
    links.forEach(function (link) {
      var href = (link.getAttribute('data-route') || '').replace(/^#/, '');
      var active = path === href || path.indexOf(href + '/') === 0;
      link.classList.toggle('active', active);
    });
  }

  function renderRoute() {
    var root = document.getElementById('view-root');
    if (!root) return; // shell ainda não montado (tela de acesso não configurado, etc.)
    var path = parseHash();
    updateActiveNav(path);
    var match = matchRoute(path);
    var titleEl = document.getElementById('topbar-title');
    if (!match) {
      if (titleEl) titleEl.textContent = 'Página não encontrada';
      root.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Página não encontrada.</p>'
        + '<p class="text-xs" style="margin-top:6px;"><a href="#" data-route="#/dashboard">Voltar ao dashboard</a></p></div>';
      return;
    }
    if (titleEl) titleEl.textContent = match.route.title;
    root.innerHTML = '<div class="loading-row"><div class="spinner"></div><span>Carregando...</span></div>';
    try {
      match.route.view(root, match.params);
    } catch (err) {
      root.innerHTML = errorStateHtml(apiErrorMessage(err));
    }
  }

  function errorStateHtml(message) {
    return '<div class="banner banner-danger">' + escapeHtml(message) + '</div>';

  function initials(name) {
    if (!name) return '?';
    var parts = String(name).trim().split(/\s+/);
    var first = parts[0] ? parts[0].charAt(0) : '';
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  function navHtml(user) {
    return NAV_GROUPS.map(function (group) {
      var items = group.items.filter(function (item) {

      if (items.length === 0) return '';
      return (
        '<div class="nav-group"><div class="nav-group-title">' +
        escapeHtml(group.title) +
        '</div>' +
        items
          .map(function (item) {
            return (
              '<a href="#" class="nav-link" data-route="' +
              item.href +
              '"><span class="dot"></span><span class="label">' +
              escapeHtml(item.label) +
              '</span></a>'
            );
          })
          .join('') +
        '</div>'
      );
    }).join('');
  }

  /** Modal para o usuário trocar a própria senha (pede a atual quando já existe uma). */
  function openChangePasswordModal() {
    var hasPassword = !!(App.user && App.user.hasPassword);
    var html =
      '<div class="modal-header"><h3>Alterar senha</h3><button class="modal-close" data-action="modal-close">&times;</button></div>' +
      (hasPassword
        ? '<div class="field"><label>Senha atual</label><input type="password" id="change-pwd-current" autocomplete="current-password" /></div>'
        : '<p class="text-sm" style="margin-bottom:12px;color:var(--slate-600);">Você ainda não tem uma senha cadastrada — defina uma agora.</p>') +
      '<div class="field"><label>Nova senha</label><input type="password" id="change-pwd-new" autocomplete="new-password" />' +
      '<p class="text-xs text-faint" style="margin-top:4px;">Mínimo de 6 caracteres.</p></div>' +
      '<div class="field"><label>Confirmar nova senha</label><input type="password" id="change-pwd-confirm" autocomplete="new-password" /></div>' +
      '<p class="field-error" id="change-pwd-error" style="display:none;"></p>' +
      '<div class="form-actions">' +
      '<button class="btn btn-outline" data-action="modal-close">Cancelar</button>' +
      '<button class="btn btn-success" id="change-pwd-confirm-btn">Salvar</button></div>';
    var modalEl = Modal.open(html);
    var errEl = modalEl.querySelector('#change-pwd-error');
    modalEl.querySelector('#change-pwd-confirm-btn').addEventListener('click', function () {
      var current = hasPassword ? modalEl.querySelector('#change-pwd-current').value : '';
      var next = modalEl.querySelector('#change-pwd-new').value;
      var confirm = modalEl.querySelector('#change-pwd-confirm').value;
      if (next.length < 6) {
        errEl.textContent = 'A nova senha precisa ter ao menos 6 caracteres.';
        errEl.style.display = 'block';
        return;
      }
      if (next !== confirm) {

  // -----------------------------------------------------------------------

  var fmt = {
    currency: function (v) {
      var n = Number(v);
      if (v === null || v === undefined || isNaN(n)) n = 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    },
    percent: function (v, decimals) {
      if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '—';
      return Number(v).toFixed(decimals === undefined ? 1 : decimals).replace('.', ',') + '%';
    },
    number: function (v) {
      if (v === null || v === undefined || isNaN(Number(v))) return '0';
      return Number(v).toLocaleString('pt-BR');
    },
    date: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
    },
    dateTime: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    },
    monthLabel: function (yyyyMm) {
      if (!yyyyMm) return '';
      var parts = String(yyyyMm).split('-');
      var months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      var m = parseInt(parts[1], 10) - 1;
      return (months[m] || parts[1]) + '/' + String(parts[0]).slice(2);
    },
  };

  function escapeHtml(str) {

    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Altura útil (em px) disponível para a barra dentro de .bar-chart (140px
  // no total — ver Styles.html) descontando o rótulo do mês e o gap abaixo
  // dela. Alturas são calculadas em px (não %) de propósito: `height: X%`
  // só resolve corretamente se TODOS os ancestrais tiverem altura definida,
  // o que .bar-chart-col não garante (é um item flex sem altura própria) —
  // em px o cálculo não depende disso e sempre renderiza certo.
  var BAR_CHART_MAX_PX = 108;

  /** Mini gráfico de barras em CSS puro (sem libs) — usado nos dashboards. */
  function renderBarChart(items, opts) {
    opts = opts || {};
    if (!items || items.length === 0) {
      return '<p class="text-sm text-muted">Sem dados para exibir.</p>';
    }
    var max = Math.max.apply(
      null,
      items.map(function (i) {
        return Math.abs(Number(i.value) || 0);
      }).concat([1])
    );
    return (
      '<div class="bar-chart">' +
      items
        .map(function (i) {
          var val = Number(i.value) || 0;
          var h = Math.max(2, Math.round((Math.abs(val) / max) * BAR_CHART_MAX_PX));
          var neg = val < 0;
          var displayVal = opts.formatter ? opts.formatter(val) : String(val);
          return (
            '<div class="bar-chart-col" title="' +
            escapeHtml(i.label) +
            ': ' +
            escapeHtml(displayVal) +
            '"><div class="bar-chart-bar' +
            (neg ? ' negative' : '') +
            '" style="height:' +
            h +
            'px"></div><div class="bar-chart-label">' +
            escapeHtml(i.label) +
            '</div></div>'
          );
        })
        .join('') +
      '</div>'
    );
  }

  /**
   * Gráfico de barras agrupadas (2 séries por coluna) em CSS puro — usado
   * pelo Dashboard Executivo para orçado x atual por centro de custo.
   * items: [{label, budgeted, current, status}] — a barra "atual" fica
   * vermelha quando status === 'ACIMA' (fora do orçamento).
   */
  function renderGroupedBarChart(items, opts) {
    opts = opts || {};
    if (!items || items.length === 0) {
      return '<p class="text-sm text-muted">Sem dados para exibir.</p>';
    }
    var max = Math.max.apply(
      null,
      items
        .map(function (i) { return Math.abs(Number(i.budgeted) || 0); })
        .concat(items.map(function (i) { return Math.abs(Number(i.current) || 0); }))
        .concat([1])
    );
    var legend =
      '<div class="bar-chart-legend">' +
      '<span><span class="bar-chart-legend-dot" style="background:var(--slate-300,#cbd5e1);"></span>Orçado</span>' +
      '<span><span class="bar-chart-legend-dot" style="background:var(--brand-500);"></span>Dentro do orçamento</span>' +
      '<span><span class="bar-chart-legend-dot" style="background:var(--red-500,#ef4444);"></span>Acima do orçamento</span>' +
      '</div>';
    return (
      legend +
      '<div class="bar-chart">' +
      items
        .map(function (i) {
          var budgeted = Number(i.budgeted) || 0;
          var current = Number(i.current) || 0;
          var hBudgeted = Math.max(2, Math.round((Math.abs(budgeted) / max) * BAR_CHART_MAX_PX));
          var hCurrent = Math.max(2, Math.round((Math.abs(current) / max) * BAR_CHART_MAX_PX));
          var currentClass = i.status === 'ACIMA' ? ' negative' : '';
          var title =
            escapeHtml(i.label) +
            ' — Orçado: ' +
            escapeHtml(opts.formatter ? opts.formatter(budgeted) : String(budgeted)) +
            ' / Atual: ' +
            escapeHtml(opts.formatter ? opts.formatter(current) : String(current));
          return (
            '<div class="bar-chart-col" title="' +
            title +
            '"><div class="bar-chart-group">' +
            '<div class="bar-chart-bar muted" style="height:' +
            hBudgeted +
            'px"></div>' +
            '<div class="bar-chart-bar' +
            currentClass +
            '" style="height:' +
            hCurrent +
            'px"></div>' +
            '</div><div class="bar-chart-label">' +
            escapeHtml(i.label) +
            '</div></div>'
          );
        })
        .join('') +
      '</div>'
    );
  }

  // -----------------------------------------------------------------------
  function readFileAsBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result || '';
        var comma = result.indexOf(',');
        resolve(comma === -1 ? result : result.slice(comma + 1));
      };
      reader.onerror = function () {
        reject(reader.error || new Error('Falha ao ler o arquivo selecionado.'));
      };
      reader.readAsDataURL(file);
    });
  }

  function mountEmployeePicker(container, employees, opts) {

    function renderList(term) {

        .filter(function (e) {

        })
        .slice(0, 50);
      if (matches.length === 0) {
        list.innerHTML = '<div class="ep-item text-muted">Nenhum colaborador encontrado.</div>';
      } else {
        list.innerHTML = matches
          .map(function (e) {
            return (
              '<div class="ep-item" data-id="' +
              escapeHtml(e.id) +
              '">' +
              escapeHtml(e.name) +
              '<div class="ep-item-sub">Mat. ' +
              escapeHtml(e.registration) +
              (e.positionName ? ' · ' + escapeHtml(e.positionName) : '') +
              '</div></div>'
            );
          })
          .join('');
      }
      list.hidden = false;
    }

    input.addEventListener('focus', function () {
      renderList(input.value === initialLabel ? '' : input.value);
    });
    input.addEventListener('input', function () {
      selected = null;
      if (opts.onChange) opts.onChange(null);
      renderList(input.value);
    });
    list.addEventListener('mousedown', function (e) {
      var item = e.target.closest('.ep-item[data-id]');
      if (!item) return;
      var id = item.getAttribute('data-id');
      var emp = null;
      for (var i = 0; i < employees.length; i++) {
        if (employees[i].id === id) {
          emp = employees[i];
          break;
        }
      }
      if (emp) {
        selected = emp;
        input.value = emp.name + ' (' + emp.registration + ')';
        list.hidden = true;
        if (opts.onChange) opts.onChange(emp);
      }
    });
    document.addEventListener('click', function (e) {
      if (!container.contains(e.target)) list.hidden = true;
    });

    return {
      getSelected: function () {
        return selected;
      },
    };
  }
</script>
